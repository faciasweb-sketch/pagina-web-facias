backend:
  name: git-gateway
  repo: faciasweb-sketch/pagina-web-facias
  branch: main
  site_domain: precious-donut-ae4543.netlify.app

media_folder: "Assets"
public_folder: "/Assets"

collections:
  - name: "novedades"
    label: "Novedades Destacadas"
    folder: "datos/novedades"
    create: true
    extension: "json"
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título de la Novedad", name: "title", widget: "string" }
      - label: "Público"
        name: "publico"
        widget: "select"
        options:
          - "Todos"
          - "Ingresantes"
          - "Estudiantes"
          - "Docentes"
          - "Graduados"
          - "Organizaciones"
        default: "Todos"
      - label: "Tema"
        name: "tema"
        widget: "select"
        options:
          - "Todos"
          - "Concursos docentes"
          - "Mesas de examen"
          - "Horarios"
          - "Convocatorias"
          - "Becas"
          - "Posgrado"
          - "Cursos"
        default: "Todos"
      - { label: "Fecha de Publicación", name: "fecha", widget: "date", format: "DD de MMMM, YYYY" }
      - { label: "Imagen de Portada", name: "imagen", widget: "image" }
      - { label: "Contenido/Cuerpo", name: "body", widget: "text" }
