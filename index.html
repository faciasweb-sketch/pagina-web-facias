<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Administración | FACIAS CMS</title>
  <!-- Ruta explicita a la configuracion del CMS -->
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
  <!-- Widget de identidad de Netlify -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.init({
        APIUrl: 'https://precious-donut-ae4543.netlify.app/.netlify/identity'
      });
      window.netlifyIdentity.on('init', function(user) {
        if (!user) {
          window.netlifyIdentity.open('login');
          window.netlifyIdentity.on('login', function() {
            document.location.reload();
          });
        }
      });
    }
  </script>
</head>
<body>
  <!-- Carga del Decap CMS desde CDN -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
